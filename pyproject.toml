[project]
name = "ecgpit"
version = "0.1.0"
description = "Multi-label classification of 12-lead ECG with a hybrid CNN-LSTM (SC 211 Final PIT)"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "torch", "matplotlib", "pyyaml", "onnx", "onnxruntime", "av"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecgpit = ["static/*"]
